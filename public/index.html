<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de usuários | Gabriel Damasceno</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Cadastro de usuários | Gabriel Damasceno</h1>
    <form id="formulario">
      <input id="nome" placeholder="Digite o nome" required>
      <input id="email" type="email" placeholder="Digite o e-mail" required>
      <button type="submit">Cadastrar</button>
    </form>
    <p id="mensagem"></p>
    <ul id="lista"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
